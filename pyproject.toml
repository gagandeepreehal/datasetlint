[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasetlint"
version = "0.1.0"
description = "Lightweight, local-first linting for robotics and physical AI datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Gagandeep Reehal" }
]
maintainers = [
  { name = "Gagandeep Reehal" }
]
keywords = ["robotics", "datasets", "validation", "physical-ai", "lint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "pydantic>=2",
  "typer>=0.9",
  "rich>=13",
]

[project.optional-dependencies]
dev = [
  "numpy<2.5",
  "pytest>=7",
  "ruff>=0.4",
  "mypy>=1.8",
  "build>=1",
  "twine>=5",
]
docs = [
  "mkdocs>=1.6",
]

[project.scripts]
datasetlint = "datasetlint.cli:app"

[project.urls]
Homepage = "https://github.com/gagandeepreehal/datasetlint"
Source = "https://github.com/gagandeepreehal/datasetlint"
Issues = "https://github.com/gagandeepreehal/datasetlint/issues"
Documentation = "https://gagandeepreehal.github.io/datasetlint/"
Changelog = "https://github.com/gagandeepreehal/datasetlint/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["datasetlint*"]

[tool.setuptools.package-data]
datasetlint = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["datasetlint"]
strict = true
disallow_untyped_decorators = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "rich", "rich.*", "typer", "typer.*"]
ignore_missing_imports = true
