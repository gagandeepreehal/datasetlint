site_name: DatasetLint
site_description: Lightweight, local-first linting for robotics and physical AI datasets.
site_url: https://gagandeepreehal.github.io/datasetlint/
repo_url: https://github.com/gagandeepreehal/datasetlint
repo_name: gagandeepreehal/datasetlint
site_author: Gagandeep Reehal
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Gagandeep Reehal

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - bash
    - json
    - python
    - text
    - toml
    - yaml
  navigation_depth: 3
  collapse_navigation: false
  sticky_navigation: true
  prev_next_buttons_location: both
  include_homepage_in_sidebar: true

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - footnotes
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Start:
      - Installation: installation.md
      - Getting Started: getting-started.md
      - Quickstart: quickstart.md
      - Troubleshooting: troubleshooting.md
  - Use DatasetLint:
      - Concepts: concepts.md
      - Dataset Format: dataset-format.md
      - Rules: rules.md
      - Checks: checks.md
      - Configuration: configuration.md
      - Reports: reports.md
      - Stats: stats.md
      - Diff: diff.md
  - Integrate:
      - CLI Reference: cli.md
      - Python API: python-api.md
      - CI Templates: ci.md
      - Adapters: adapters.md
  - Maintain:
      - Architecture: architecture.md
      - Development: development.md
      - Release: release.md
      - Release Checklist: release-checklist.md
      - Roadmap: roadmap.md

strict: true
use_directory_urls: true
